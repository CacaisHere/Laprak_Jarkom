<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Hello World</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4b0c44, #e738a1);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .card-custom {
            width: 400px;
            border: none;
            border-radius: 25px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: 0.4s;
        }

        .card-custom:hover {
            transform: translateY(-10px) scale(1.02);
        }

        .card-body {
            padding: 50px 30px;
            text-align: center;
            color: white;
        }

        .emoji {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            font-weight: bold;
            margin-bottom: 15px;
        }

        p {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="card card-custom">
        <div class="card-body">

            <div class="icon">
                <i class="bi bi-stars"></i>
            </div>
            <h1>Hello World!</h1>
            <p>
                Selamat datang di website pertamaku yang menggunakan Bootstrap wkwk
            </p>
        </div>
    </div>

</body>

</html>
